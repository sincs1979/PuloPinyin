[package]
name = "ime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "部落输入法 macOS InputMethodKit frontend"

[[bin]]
name = "BuluoIME"
path = "src/main.rs"

[target.'cfg(target_os = "macos")'.dependencies]
engine.workspace = true
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSAttributedString",
    "NSBundle",
    "NSDictionary",
    "NSGeometry",
    "NSObject",
    "NSRange",
    "NSString",
    "NSThread",
    "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
    "NSAppearance",
    "NSApplication",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSGraphics",
    "NSAttributedString",
    "NSPanel",
    "NSResponder",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }
objc2-input-method-kit = { version = "0.3", features = [
    "IMKInputController",
    "IMKServer",
] }
