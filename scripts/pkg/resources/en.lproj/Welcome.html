<h1>Buluo IME</h1>
<p>This package installs <b>BuluoIME.app</b> into Input Methods and registers it with macOS.</p>
<p>Then: <b>System Settings → Keyboard → Input Sources → Edit… → +</b>, search for <b>部落</b> or <b>Buluo</b>, add it, switch away and back.</p>
<p>Type <code>zhongguo</code> then Space for 中国.</p>
